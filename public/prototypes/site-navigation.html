<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>JW — click-wheel navigation</title>
    <style>
      @font-face {
        font-family: "Geist Mono";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2") format("woff2");
      }

      :root {
        color-scheme: dark;
        --background: oklch(0.2263 0.0214 280.4871);
        --foreground: oklch(0.8456 0.0611 274.7629);
        --card: oklch(0.2040 0.0158 284.9095);
        --card-foreground: oklch(0.8456 0.0611 274.7629);
        --primary: oklch(0.7190 0.1322 264.2022);
        --primary-foreground: oklch(0.2263 0.0214 280.4871);
        --secondary: oklch(0.2819 0.0355 274.7479);
        --secondary-foreground: oklch(0.8456 0.0611 274.7629);
        --muted: oklch(0.3056 0.0369 273.2268);
        --muted-foreground: oklch(0.4955 0.0682 274.3739);
        --accent: oklch(0.4955 0.0682 274.3739);
        --accent-foreground: oklch(0.8456 0.0611 274.7629);
        --border: oklch(0.3056 0.0369 273.2268);
        --input: oklch(0.2591 0.0249 274.4439);
        --ring: oklch(0.7190 0.1322 264.2022);
        --radius: 0rem;
        --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
        color: var(--foreground);
        background: var(--background);
        font-family: var(--font-mono);
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { min-width: 320px; min-height: 100svh; background: var(--background); }
      button { color: inherit; font: inherit; }
      button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      #stage { width: 100%; height: 100svh; height: 100dvh; min-height: 100svh; background: var(--background); }

      .device {
        display: grid;
        width: 100%;
        height: 100%;
        min-height: 0;
        grid-template-columns: minmax(0,1fr) 238px;
        gap: 16px;
        padding: 18px;
        overflow: hidden;
        border: 0;
        border-radius: var(--radius);
        background: var(--background);
        color: var(--foreground);
      }
      .device-screen { display: flex; min-width: 0; min-height: 0; flex-direction: column; border: 1px solid var(--border); background: var(--background); }
      .screen-header { display: grid; min-height: 43px; grid-template-columns: minmax(0,1fr) auto; align-items: center; gap: 10px; padding: 7px 10px; border-bottom: 1px solid var(--border); color: color-mix(in oklab,var(--foreground) 70%,var(--muted-foreground)); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
      .screen-path { overflow: hidden; color: var(--primary); text-overflow: ellipsis; white-space: nowrap; }
      .screen-memory { white-space: nowrap; }
      .screen-view { min-height: 0; flex: 1; overflow: auto; padding: clamp(20px,3vw,42px) clamp(16px,4vw,56px); scrollbar-color: var(--muted-foreground) var(--background); scrollbar-width: thin; }
      .screen-title { margin: 0 0 7px; font-size: clamp(20px,2.2vw,28px); line-height: 1.2; letter-spacing: -.045em; font-weight: 600; }
      .screen-prompt { margin: 0 0 16px; color: color-mix(in oklab,var(--foreground) 70%,var(--muted-foreground)); font-size: 9px; letter-spacing: .08em; text-transform: uppercase; }
      .item-list { display: grid; max-width: 880px; gap: 3px; }
      .menu-item {
        display: grid;
        width: 100%;
        min-height: 50px;
        grid-template-columns: 34px 42px minmax(0,1fr) 20px;
        align-items: center;
        gap: 8px;
        padding: 5px 10px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: transparent;
        color: var(--foreground);
        text-align: left;
        cursor: pointer;
      }
      .menu-item:hover { background: var(--card); }
      .menu-item[aria-current="true"] { border-color: var(--primary); background: var(--secondary); color: var(--foreground); }
      .item-number, .item-kind { color: color-mix(in oklab,var(--foreground) 68%,var(--muted-foreground)); font-size: 9px; }
      .item-kind { letter-spacing: .06em; }
      .item-name { overflow: hidden; font-size: clamp(11px,1.1vw,13px); text-overflow: ellipsis; white-space: nowrap; }
      .item-chevron { color: var(--primary); text-align: right; }
      .screen-footer { display: flex; min-height: 34px; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 10px; border-top: 1px solid var(--border); color: color-mix(in oklab,var(--foreground) 68%,var(--muted-foreground)); font-size: 8px; letter-spacing: .08em; text-transform: uppercase; }
      .leaf-label { display: inline-flex; align-items: center; gap: 7px; color: var(--primary); font-size: 9px; letter-spacing: .11em; text-transform: uppercase; }
      .leaf-label::before { width: 6px; height: 6px; background: var(--accent); content: ""; }
      .leaf-title { margin: 15px 0 12px; font-size: clamp(24px,4vw,42px); line-height: 1.12; letter-spacing: -.055em; }
      .leaf-copy { max-width: 64ch; margin: 0; color: color-mix(in oklab,var(--foreground) 78%,var(--muted-foreground)); font-size: clamp(12px,1.3vw,14px); line-height: 1.85; }
      .leaf-meta { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--border); color: color-mix(in oklab,var(--foreground) 68%,var(--muted-foreground)); font-size: 9px; line-height: 1.7; }
      .leaf-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 16px; }
      .leaf-tags span { padding: 5px 7px; border: 1px solid var(--border); color: color-mix(in oklab,var(--foreground) 78%,var(--muted-foreground)); font-size: 9px; }

      .click-controls { display: grid; grid-template-rows: auto minmax(0,1fr) auto; align-items: center; justify-items: center; gap: 12px; padding: 10px; border-left: 1px solid var(--border); }
      .control-caption { margin: 0; color: color-mix(in oklab,var(--foreground) 68%,var(--muted-foreground)); text-align: center; font-size: 8px; line-height: 1.8; letter-spacing: .1em; text-transform: uppercase; }
      .click-wheel { position: relative; display: grid; width: min(210px,100%); aspect-ratio: 1; place-items: center; touch-action: none; }
      .wheel-outline, .wheel-rotor { position: absolute; border: 1px solid var(--muted-foreground); border-radius: 50%; }
      .wheel-outline { inset: 3px; }
      .wheel-outline::after { position: absolute; inset: 13px; border: 1px dotted var(--muted-foreground); border-radius: 50%; content: ""; }
      .wheel-rotor { inset: 17px; border: 2px solid var(--primary); transform: rotate(var(--turn,0deg)); transition: transform 180ms cubic-bezier(.77,0,.175,1); }
      .wheel-rotor::before { position: absolute; top: 7px; left: calc(50% - 2px); width: 4px; height: 18px; background: var(--primary); content: ""; }
      .wheel-rotor::after { position: absolute; top: 26px; right: 17px; width: 6px; height: 6px; background: var(--accent); content: ""; }
      .wheel-button { position: absolute; z-index: 1; display: grid; width: 42px; height: 42px; place-items: center; padding: 0; border: 0; border-radius: 50%; background: transparent; color: var(--foreground); font-size: 15px; cursor: pointer; }
      .wheel-button:hover { background: var(--card); }
      .wheel-button:active, .wheel-center:active { transform: scale(.97); }
      .wheel-up { top: 0; left: calc(50% - 21px); }
      .wheel-right { top: calc(50% - 21px); right: 0; }
      .wheel-down { bottom: 0; left: calc(50% - 21px); }
      .wheel-left { top: calc(50% - 21px); left: 0; }
      .wheel-center { z-index: 2; width: 66px; height: 66px; border: 1px solid var(--border); border-radius: 50%; background: var(--background); color: var(--foreground); font-size: 8px; letter-spacing: .08em; cursor: pointer; transition: transform 140ms cubic-bezier(.23,1,.32,1); }
      .wheel-center:hover { border-color: var(--primary); }
      @media (hover: hover) and (pointer: fine) {
        .wheel-button:hover { color: var(--primary); }
      }
      @media (prefers-reduced-motion: reduce) {
        .wheel-rotor { transition: none; }
      }

      @media (max-width: 600px) {
        .device { grid-template-columns: minmax(0,1fr); grid-template-rows: minmax(0,1fr) 148px; gap: 8px; padding: 8px; }
        .screen-view { padding: 14px 10px; }
        .screen-header { min-height: 36px; padding: 5px 8px; font-size: 7px; }
        .screen-memory { display: none; }
        .screen-title { margin-bottom: 5px; font-size: 16px; }
        .screen-prompt { margin-bottom: 8px; font-size: 7px; }
        .menu-item { min-height: 37px; grid-template-columns: 23px 29px minmax(0,1fr) 14px; gap: 5px; padding: 3px 6px; }
        .item-number, .item-kind { font-size: 8px; }
        .item-name { font-size: 10px; }
        .screen-footer { min-height: 27px; padding: 5px 7px; font-size: 7px; }
        .click-controls { grid-template: 1fr / minmax(0,1fr); padding: 0; border: 0; }
        .control-caption { display: none; }
        .click-wheel { width: 136px; }
        .wheel-rotor { inset: 14px; }
        .wheel-button { width: 32px; height: 32px; font-size: 13px; }
        .wheel-up { left: calc(50% - 16px); }
        .wheel-right { top: calc(50% - 16px); }
        .wheel-down { left: calc(50% - 16px); }
        .wheel-left { top: calc(50% - 16px); }
        .wheel-center { width: 52px; height: 52px; font-size: 7px; }
        .leaf-title { margin: 9px 0; font-size: 21px; }
        .leaf-copy { font-size: 10px; }
      }
      @media (max-height: 700px) and (max-width: 600px) {
        .device { grid-template-rows: minmax(0,1fr) 120px; padding: 6px; }
        .click-wheel { width: 108px; }
        .wheel-rotor { inset: 11px; }
        .wheel-button { width: 27px; height: 27px; }
        .wheel-up { left: calc(50% - 13.5px); }
        .wheel-right { top: calc(50% - 13.5px); }
        .wheel-down { left: calc(50% - 13.5px); }
        .wheel-left { top: calc(50% - 13.5px); }
        .wheel-center { width: 42px; height: 42px; }
      }
      @media (max-width: 360px) {
        .screen-view { padding-inline: 7px; }
        .menu-item { grid-template-columns: 19px 25px minmax(0,1fr) 11px; gap: 3px; }
        .item-name { font-size: 9px; }
      }
    </style>
  </head>
  <body>
    <main id="stage" aria-label="JW handheld player"></main>
    <script>
      const rootItems = [
        { label: "About JW", kind: "document", body: "I’m a full-stack developer from Cologne, Germany. I like making useful web applications, trying unfamiliar tools, and learning by building.", meta: "PROFILE / COLOGNE, GERMANY" },
        { label: "Projects", kind: "folder", items: [
          { label: "MyVinylCollection", kind: "folder", items: [
            { label: "Overview", kind: "document", body: "A home for record collectors to share their collections, keep track of new releases, and talk about the records they love.", meta: "PROJECT / IN PROGRESS", tags: ["TanStack Start", "Effect", "Drizzle"] },
            { label: "How it started", kind: "document", body: "I got a record player for my birthday, then inherited some of my dad’s old records. Years later, a conversation with friends turned into the idea for a shared collection site.", meta: "PROJECT NOTES / ORIGIN" },
            { label: "Technology", kind: "document", body: "Built while exploring TanStack Start and Effect, with Drizzle for data. The project is still evolving as I learn what collectors actually need.", meta: "PROJECT NOTES / STACK", tags: ["TypeScript", "TanStack", "Effect", "Drizzle"] },
          ] },
          { label: "SpotUI", kind: "folder", items: [
            { label: "Overview", kind: "document", body: "An interface experiment: a place to try small interaction ideas, explore visual patterns, and learn by shipping.", meta: "PROJECT / EXPERIMENT" },
            { label: "Design notes", kind: "document", body: "I’m interested in interfaces that feel clear and direct, with details that reward attention without getting in the way.", meta: "PROJECT NOTES / DESIGN" },
          ] },
        ] },
        { label: "Gallery", kind: "folder", items: [
          { label: "Spring 2026", kind: "folder", items: [
            { label: "Cherry flowers", kind: "document", body: "A few blossoms catching the light on a walk through the city. Spring always seems to arrive all at once in Cologne.", meta: "PHOTO / SPRING 2026" },
            { label: "Garden walk", kind: "document", body: "A quiet path, a bridge over the water, and enough time to take the long way home.", meta: "PHOTO / SPRING 2026" },
          ] },
          { label: "Summer 2026", kind: "folder", items: [
            { label: "Outside again", kind: "document", body: "Longer evenings and small trips outside the city. A roll of photos from summer days.", meta: "PHOTO / SUMMER 2026" },
          ] },
        ] },
        { label: "Journal", kind: "folder", items: [
          { label: "Learning Effect", kind: "document", body: "Trying Effect has been a fun chance to learn another way of structuring programs and thinking about failure.", meta: "NOTE / LEARNING" },
          { label: "What I’m building", kind: "document", body: "Notes on the projects currently on my desk, what I’m curious about, and the ideas I want to return to.", meta: "NOTE / NOW" },
        ] },
        { label: "Contact", kind: "document", body: "I’m JW, based in Cologne. Find me on GitHub or Bluesky, or say hello if something I’m making catches your interest.", meta: "CONTACT / COLOGNE" },
      ];

      const stage = document.getElementById("stage");
      const state = { stack: [{ title: "MAIN MENU", items: rootItems, selected: 0 }], view: "list", leaf: null };

      function activeFrame() { return state.stack[state.stack.length - 1]; }
      function selectedItem() { return activeFrame().items[activeFrame().selected]; }
      function currentPath() { return state.stack.map((frame) => frame.title).join(" / ") + (state.view === "detail" && state.leaf ? ` / ${state.leaf.label}` : ""); }

      function screenPanel() {
        const frame = activeFrame();
        if (state.view === "detail" && state.leaf) {
          const tags = state.leaf.tags?.length ? `<div class="leaf-tags">${state.leaf.tags.map((tag) => `<span>${tag}</span>`).join("")}</div>` : "";
          return `<div class="detail-view"><span class="leaf-label">${state.leaf.meta || "ITEM / FILE"}</span><h1 class="leaf-title">${state.leaf.label}</h1><p class="leaf-copy">${state.leaf.body}</p>${tags}<p class="leaf-meta">PRESS BACK TO RETURN TO ${frame.title}</p></div>`;
        }

        return `<div class="list-view"><h1 class="screen-title">${frame.title}</h1><p class="screen-prompt">Choose an item · press select to open</p><nav class="item-list" aria-label="${frame.title}">${frame.items.map((item, index) => `<button type="button" class="menu-item" data-item-index="${index}" ${index === frame.selected ? 'aria-current="true"' : ""}><span class="item-number">${String(index + 1).padStart(2, "0")}</span><span class="item-kind">${item.kind === "folder" ? "DIR" : "FILE"}</span><span class="item-name">${item.label}</span><span class="item-chevron" aria-hidden="true">${item.kind === "folder" ? "›" : "·"}</span></button>`).join("")}</nav></div>`;
      }

      function display() {
        const selection = selectedItem();
        const status = state.view === "detail" ? `FILE OPEN · ${state.leaf.label}` : `${activeFrame().selected + 1} / ${activeFrame().items.length} · ${selection.label}`;
        return `<section class="device-screen" aria-label="Player display"><header class="screen-header"><span class="screen-path" data-screen-path>${currentPath()}</span><span class="screen-memory">MEM ${String(activeFrame().selected + 1).padStart(2,"0")}/${String(activeFrame().items.length).padStart(2,"0")}</span></header><div class="screen-view" data-screen-view>${screenPanel()}</div><footer class="screen-footer" aria-live="polite" aria-atomic="true"><span data-status>${status}</span><span data-depth>LEVEL ${state.stack.length}</span></footer></section>`;
      }

      function clickWheel() {
        return `<article class="device" aria-label="Click wheel handheld player">${display()}<section class="click-controls" aria-label="Player controls"><p class="control-caption">ROTATE<br />TO BROWSE</p><div class="click-wheel" role="group" aria-label="Click wheel"><span class="wheel-outline" aria-hidden="true"></span><span class="wheel-rotor moving-part" data-moving="wheel" aria-hidden="true"></span><button class="wheel-button wheel-up" data-action="up" aria-label="Previous item">▲</button><button class="wheel-button wheel-right" data-action="enter" aria-label="Open selected item">▶</button><button class="wheel-button wheel-down" data-action="down" aria-label="Next item">▼</button><button class="wheel-button wheel-left" data-action="back" aria-label="Back one level">◀</button><button class="wheel-center" data-action="enter">SELECT</button></div><p class="control-caption">CENTER<br />TO OPEN</p></section></article>`;
      }

      function turnWheel() {
        const angle = activeFrame().selected * 38 + (state.stack.length - 1) * 70;
        stage.querySelector("[data-moving='wheel']")?.style.setProperty("--turn", `${angle}deg`);
      }

      function refreshScreen() {
        const screen = stage.querySelector("[data-screen-view]");
        if (!screen) return;
        const focused = document.activeElement;
        const wasItem = focused?.hasAttribute("data-item-index");
        const focusedAction = focused?.dataset?.action;
        screen.innerHTML = screenPanel();
        stage.querySelector("[data-screen-path]").textContent = currentPath();
        stage.querySelector(".screen-memory").textContent = `MEM ${String(activeFrame().selected + 1).padStart(2,"0")}/${String(activeFrame().items.length).padStart(2,"0")}`;
        stage.querySelector("[data-status]").textContent = state.view === "detail" ? `FILE OPEN · ${state.leaf.label}` : `${activeFrame().selected + 1} / ${activeFrame().items.length} · ${selectedItem().label}`;
        stage.querySelector("[data-depth]").textContent = `LEVEL ${state.stack.length}`;
        turnWheel();
        stage.querySelector(`[data-item-index="${activeFrame().selected}"]`)?.scrollIntoView({ block: "nearest" });
        if (wasItem) stage.querySelector(`[data-item-index="${activeFrame().selected}"]`)?.focus({ preventScroll: true });
        else if (focusedAction) stage.querySelector(`[data-action="${focusedAction}"]`)?.focus({ preventScroll: true });
      }

      function selectIndex(index) {
        const frame = activeFrame();
        frame.selected = (index + frame.items.length) % frame.items.length;
        refreshScreen();
      }

      function moveSelection(direction) {
        if (state.view === "list") selectIndex(activeFrame().selected + direction);
      }

      function enterSelection() {
        if (state.view === "detail") return;
        const item = selectedItem();
        if (item.kind === "folder") {
          state.stack.push({ title: item.label.toUpperCase(), items: item.items, selected: 0 });
          state.view = "list";
          state.leaf = null;
        } else {
          state.view = "detail";
          state.leaf = item;
        }
        refreshScreen();
      }

      function goBack() {
        if (state.view === "detail") {
          state.view = "list";
          state.leaf = null;
        } else if (state.stack.length > 1) {
          state.stack.pop();
        }
        refreshScreen();
      }

      stage.innerHTML = clickWheel();
      requestAnimationFrame(() => turnWheel());

      stage.addEventListener("click", (event) => {
        const row = event.target.closest("[data-item-index]");
        if (row) {
          selectIndex(Number(row.dataset.itemIndex));
          return;
        }
        const control = event.target.closest("[data-action]");
        if (!control) return;
        if (control.dataset.action === "up") moveSelection(-1);
        else if (control.dataset.action === "down") moveSelection(1);
        else if (control.dataset.action === "enter") enterSelection();
        else if (control.dataset.action === "back") goBack();
      });

      stage.addEventListener("wheel", (event) => {
        if (!event.target.closest(".click-wheel")) return;
        event.preventDefault();
        moveSelection(event.deltaY > 0 ? 1 : -1);
      }, { passive: false });
    </script>
  </body>
</html>
